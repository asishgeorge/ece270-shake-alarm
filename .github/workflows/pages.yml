# Publishes ONLY the phone/ folder to GitHub Pages (free HTTPS, which phones require
# before a page may read motion sensors). Repo Settings -> Pages -> Source: GitHub Actions.
name: Publish phone page
on:
  push:
    branches: [main]
    paths: ['phone/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: phone
      - id: deployment
        uses: actions/deploy-pages@v5
